global:
  admin_address: "192.168.1.12:80"  # Admin HTTP server address for metrics and health checks (default: disabled)
  cleanup_on_exit: true      # Remove managed IPVS services and FastVIP-SNAT iptables chain on exit (default: true)
  metrics_enabled: true      # Enable Prometheus metrics endpoint (default: true)
  metrics_path: "/metrics"   # Metrics endpoint path (default: /metrics)
  log:
    level: info              # Log level: debug, info, warn, error (default: info)
    home: ./logs             # Log directory (default: ./logs)
    max_size: 50             # Max size per log file in MB (default: 50)
    max_backups: 3           # Max number of old log files to retain (default: 3)
    max_age: 0               # Max days to retain old log files, 0=no limit (default: 0)
    compress: false          # Compress rotated log files (default: false)
    traffic:
      enabled: true          # Enable traffic collector (default: true)
      interval: 20s          # Traffic stats collection interval, min 5s (default: 20s)

services:
  - name: web-service
    listen: 10.0.0.1:80
    protocol: udp
    scheduler: wrr
    health_check:
      enabled: true
      type: udp
      interval: 5s
      timeout: 3s
      fail_count: 3
      rise_count: 2
    backends:
      - address: 192.168.1.10:9091
        weight: 1
      - address: 192.168.1.11:9092
        weight: 1

  - name: web
    mode: http
    listen: 0.0.0.0:8080
    scheduler: rr
    backends:
      - address: 127.0.0.1:9001
        weight: 1
      - address: 127.0.0.1:9002
        weight: 1

  - name: internal-service
    listen: 10.0.0.2:9090
    protocol: tcp
    scheduler: rr
    health_check:
      enabled: false
    backends:
      - address: 192.168.3.10:9090
        weight: 1
      - address: 192.168.3.11:9090
        weight: 1

  - name: dns-service
    listen: 10.0.0.3:53
    protocol: udp
    scheduler: rr
    full_nat: true           # Enable FullNAT (IPVS NAT + iptables SNAT)
    snat_ip: 10.0.0.3        # Source IP for SNAT; omit for MASQUERADE
    traffic_log: true          # Per-service traffic log: true to enable raw stats logging (default: disabled)
    health_check:
      enabled: false
    backends:
      - address: 192.168.4.10:53
        weight: 1
      - address: 192.168.4.11:53
        weight: 1
